<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Haptics test</title>
<!-- a temporary page to find which haptic trick works on Jeralmi's iPhone; delete once the site uses the winner -->
<style>
  body { margin: 0; padding: 24px 18px 60px; font: 17px/1.4 -apple-system, system-ui, sans-serif; background: #f6f7f2; color: #26262b; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: #686b63; }
  button { display: block; width: 100%; margin: 0 0 14px; padding: 18px 16px; font: 600 18px -apple-system, system-ui, sans-serif; text-align: left;
    background: #d9ee6a; color: #26262b; border: 0; border-radius: 12px; -webkit-tap-highlight-color: transparent; }
  button small { display: block; font-weight: 400; font-size: 14px; color: #4f5a24; margin-top: 4px; }
  .real { display: flex; align-items: center; gap: 14px; padding: 16px; background: #fff; border-radius: 12px; margin: 0 0 14px; }
  .real input { transform: scale(1.4); }
  .info { font: 13px ui-monospace, monospace; color: #686b63; word-break: break-word; }
  /* a real switch stretched over the whole button, nearly (6) or fully (7) see-through */
  .cover { position: relative; margin: 0 0 14px; padding: 18px 16px; font-weight: 600; font-size: 18px; background: #c3d84f; border-radius: 12px; }
  .cover small { display: block; font-weight: 400; font-size: 14px; color: #4f5a24; margin-top: 4px; }
  .cover label { position: absolute; inset: 0; opacity: .02; overflow: hidden; border-radius: 12px; }
  .cover label.zero { opacity: 0; }
  .cover input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; }
</style>
</head>
<body>
<h1>Haptics test</h1>
<p>Tap each one and note which you can feel.</p>

<div class="real"><input type="checkbox" switch id="real"><label for="real"><b>1. A real switch.</b> Tap the toggle itself.</label></div>

<button id="b2">2. Hidden switch, kept off-screen<small>the switch is in the page but invisible</small></button>
<button id="b3">3. Hidden switch, not drawn at all<small>what the site does now</small></button>
<button id="b4">4. Hidden switch, clicked directly<small>the switch, not its label</small></button>
<button id="b5">5. Two quick ticks<small>version 2, twice</small></button>

<div class="cover" id="c6">6. A button with a nearly invisible switch on top<small>your finger taps the switch (almost see-through)</small><label><input type="checkbox" switch></label></div>
<div class="cover" id="c7">7. The same, with the switch fully invisible<small>opacity 0</small><label class="zero"><input type="checkbox" switch></label></div>
<p id="done" class="info"></p>

<p class="info" id="info"></p>

<script>
  function make(where, style) {
    var l = document.createElement('label'), x = document.createElement('input');
    x.type = 'checkbox'; x.setAttribute('switch', ''); l.appendChild(x); l.setAttribute('aria-hidden', 'true');
    if (style) l.style.cssText = style;
    where.appendChild(l); return { l: l, x: x };
  }
  var OFF = 'position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0.01;pointer-events:none;';
  var keep2 = make(document.body, OFF), keep4 = make(document.body, OFF);
  document.getElementById('b2').addEventListener('click', function () { keep2.l.click(); });
  document.getElementById('b3').addEventListener('click', function () {
    var s = make(document.head, 'display:none'); s.l.click(); s.l.remove();
  });
  document.getElementById('b4').addEventListener('click', function () { keep4.x.click(); });
  document.getElementById('b5').addEventListener('click', function () { keep2.l.click(); setTimeout(function () { keep2.l.click(); }, 90); });
  ['c6', 'c7'].forEach(function (id, k) {
    document.getElementById(id).querySelector('input').addEventListener('change', function () {
      document.getElementById('done').textContent = (k + 6) + ' tapped: the action still ran';
    });
  });
  document.getElementById('info').textContent = 'vibrate: ' + ('vibrate' in navigator) + ' · switch supported: ' +
    ('switch' in HTMLInputElement.prototype) + ' · ' + navigator.userAgent;
</script>
</body>
</html>
